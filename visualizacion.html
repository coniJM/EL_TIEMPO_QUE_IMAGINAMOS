<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F9ECE8">
  <title>Flor colectiva — El tiempo que imaginamos</title>
  <link rel="stylesheet" href="./css/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body { min-height: 100%; }
    body { min-height: 100vh; overflow: hidden; }
    .closing { min-height: 100vh; }
    main.closing > :not(#flor-colectiva).display-heading { position: absolute; z-index: 2; top: 28px; left: 5%; right: 5%; text-align: center; pointer-events: none; }
    .display-heading p { font-size: 10px; letter-spacing: 2px; }
    .display-heading h1 { margin-top: 8px; font: 400 clamp(24px, 4vw, 42px)/1.15 "Playfair Display", serif; }
    #flor-colectiva { inset: 75px 0 0; }
    main.closing > :not(#flor-colectiva).connection-status { position: absolute; z-index: 3; bottom: 18px; left: 0; width: 100%; text-align: center; font-size: 12px; color: var(--brown); }
    @media (max-width: 600px) { .display-heading { top: 18px; } #flor-colectiva { inset: 65px 0 0; } }
  </style>
  <script>
    window.FlorTiempoStore = {
      async load() {
        const response = await fetch("/api/respuestas");
        if (!response.ok) throw new Error("No se pudieron cargar las respuestas.");
        return response.json();
      },
      async save(answer) {
        const response = await fetch("/api/respuestas", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(answer)
        });
        if (!response.ok) throw new Error("No se pudo guardar la respuesta.");
      }
    };
  </script>
  <script src="./js/flor.js" defer></script>
  <script defer>
    document.addEventListener("DOMContentLoaded", () => {
      const status = document.getElementById("connection-status");
      const updateStatus = async () => {
        try {
          const response = await fetch("/api/respuestas");
          if (!response.ok) throw new Error();
          const answers = await response.json();
          status.textContent = answers.length
            ? answers.length + (answers.length === 1 ? " respuesta en la flor" : " respuestas en la flor")
            : "Esperando las primeras respuestas…";
          window.FlorTiempo?.refresh();
        } catch {
          status.textContent = "Sin conexión con el servidor";
        }
      };
      updateStatus();
      window.setInterval(updateStatus, 4000);
    });
  </script>
</head>
<body>
  <main class="closing screen screen--active" aria-label="Visualización de la flor colectiva">
    <div class="display-heading"><p>EL TIEMPO QUE IMAGINAMOS</p><h1>Una flor hecha entre todos</h1></div>
    <div id="flor-colectiva"></div>
    <p class="connection-status" id="connection-status" role="status">Conectando…</p>
  </main>
</body>
</html>
